{% extends 'home/base.html' %}
{% load static %}
{% block title %}Crear Cuenta{% endblock %}
{% block content %}
<div class="account-page">
    <div class="account-card">
        <h3>Crear una cuenta</h3>
        <p>Estos datos serán guardados en tu perfil.</p>

        {% include 'partials/messages.html' %}

        <form method="POST" class="profile-edit-form">
            {% csrf_token %}

            <div class="profile-form-row">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="profile-form-row">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="profile-form-row">
                <label for="first_name">Nombre</label>
                <input type="text" id="first_name" name="first_name" autocomplete="given-name">
            </div>

            <div class="profile-form-row">
                <label for="apellido_paterno">Apellido paterno</label>
                <input type="text" id="apellido_paterno" name="apellido_paterno">
            </div>

            <div class="profile-form-row">
                <label for="apellido_materno">Apellido materno</label>
                <input type="text" id="apellido_materno" name="apellido_materno">
            </div>

            <div class="profile-form-row">
                <label for="password1">Contraseña</label>
                <input type="password" id="password1" name="password1" autocomplete="new-password" required>
            </div>

            <div class="profile-form-row">
                <label for="password2">Confirmar contraseña</label>
                <input type="password" id="password2" name="password2" autocomplete="new-password" required>
            </div>

            <div class="profile-form-actions">
                <a href="{% url 'home:login' %}" class="btn btn-outline-secondary">Ya tengo cuenta</a>
                <button type="submit" class="btn btn-success">Registrarse</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
