<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  function cargarGoogle() {
    if (window.googleCargado) { return; }
    window.googleCargado = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtm.js?id=G-QFGNH8YQDD';
    document.head.appendChild(s);
    gtag('js', new Date());
  }
  try {
    if (localStorage.getItem('cookies_google') === 'si') { cargarGoogle(); }
  } catch (e) {}
</script>
