version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: canaco_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: canaco
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - mariadb_canaco_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: canaco_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      - mariadb

volumes:
  mariadb_canaco_data:
